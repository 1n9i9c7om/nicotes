<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nicotes options</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <header class="card-head">
          <img class="logo" src="icons/icon-128.png" alt="" />
          <h1>Nicotes options</h1>
          <p class="lead">The sidebar shows Nicotes from this address.</p>
        </header>
        <dl class="state">
          <dt>Showing</dt>
          <dd id="current">No address yet</dd>
          <dt>Access to the site</dt>
          <dd id="access">—</dd>
        </dl>
        <form>
          <label class="field">
            Nicotes address
            <input name="address" type="text" inputmode="url" placeholder="https://notes.example.com" autocomplete="url" spellcheck="false" required />
          </label>
          <button class="btn" type="submit">Save</button>
          <p class="status" role="status"></p>
        </form>
        <footer class="note">
          <h2>Server setting</h2>
          <p>
            Nicotes must allow the extension: set <code>NICOTES_BROWSER_EXTENSION=true</code> and
            restart it. Access to the site keeps you signed in in the sidebar; saving asks for it.
          </p>
        </footer>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
