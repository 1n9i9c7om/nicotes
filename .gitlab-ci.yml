# Builds Docker images and pushes them to the GitLab Container Registry.
# Runner: Docker executor with /var/run/docker.sock mounted (no dind, not privileged).
#
#   develop               -> :dev-latest  + :<short-sha>
#   main                  -> :main-latest + :<short-sha>
#   git tag v1.2.3        -> :v1.2.3
#   MRs / other branches  -> build only, nothing is pushed
#
# Also packs the browser extension (extension/) on every pipeline (job artifact). A tag
# v1.2.3 uploads it to the package registry (generic package "nicotes-extension", version
# 1.2.3) and creates the GitLab release with the CHANGELOG.md notes and the package linked.
# With the CI/CD variables AMO_JWT_ISSUER and AMO_JWT_SECRET (addons.mozilla.org API key),
# the tag also gets a Firefox-signed .xpi, published on GitLab Pages together with the update
# manifest (updates.json) that installed copies check for new versions.
#
# Workflow: features branch off develop and merge back into develop; a release merges develop
# into main and is tagged vX.Y.Z (see README, "Releases").

workflow:
  rules:
    # Merge request pipelines
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Skip the branch pipeline if an MR pipeline already runs for the same push
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Branch pipelines
    - if: $CI_COMMIT_BRANCH
    # Only semver tags start a pipeline (other tags would produce an empty pipeline)
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages:
  - build
  - package
  - release

variables:
  DOCKERFILE: Dockerfile
  BUILD_CONTEXT: .
  # Unique per job, so concurrent jobs on the shared host daemon never overwrite each other's build
  LOCAL_IMAGE: ci-local/$CI_PROJECT_PATH_SLUG:job-$CI_JOB_ID
  EXTENSION_PACKAGE: nicotes-extension

default:
  # Pin to the Docker major version installed on the runner VM once it works, e.g. docker:28-cli
  image: docker:cli

.docker-build:
  stage: build
  # tags: [docker]   # uncomment if your runner only picks up tagged jobs
  before_script:
    # Fails fast with a clear error if the socket isn't mounted
    - docker info --format 'Using host Docker daemon {{.ServerVersion}}'
  script:
    # The NICOTES_* build args end up in the image and are shown under Settings → About.
    # Tag builds pass their version (v1.2.3 -> 1.2.3); branch builds use package.json's version.
    # No attestations: Docker 29 would otherwise push an OCI index (image + attestation
    # manifest), which our registry rejects with "blob unknown to registry"; this way a plain
    # single-platform image manifest is pushed.
    - >
      docker build --pull
      --provenance=false --sbom=false
      --file "$DOCKERFILE"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.version=${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}"
      --build-arg "NICOTES_VERSION=${CI_COMMIT_TAG#v}"
      --build-arg "NICOTES_BUILD_REF=$CI_COMMIT_REF_NAME"
      --build-arg "NICOTES_BUILD_COMMIT=$CI_COMMIT_SHA"
      --build-arg "NICOTES_BUILD_DATE=$CI_PIPELINE_CREATED_AT"
      --tag "$LOCAL_IMAGE"
      "$BUILD_CONTEXT"
    - |
      if [ -n "$PUSH_TAGS" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        for tag in $PUSH_TAGS; do
          docker tag "$LOCAL_IMAGE" "$CI_REGISTRY_IMAGE:$tag"
          docker push "$CI_REGISTRY_IMAGE:$tag"
        done
      else
        echo "Build-only pipeline, nothing pushed."
      fi
  after_script:
    # Drop the job-local tag; layers stay in the build cache for the next job
    - docker rmi "$LOCAL_IMAGE" >/dev/null 2>&1 || true

build:check:
  extends: .docker-build
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != "main"

build:develop:
  extends: .docker-build
  interruptible: true
  variables:
    PUSH_TAGS: dev-latest $CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

build:main:
  extends: .docker-build
  interruptible: true
  variables:
    PUSH_TAGS: main-latest $CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:release:
  extends: .docker-build
  # Release builds are never auto-cancelled
  interruptible: false
  variables:
    PUSH_TAGS: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ---------- Browser extension ----------

# Every pipeline: zip extension/ (without tests), checking that its manifest has the version
# of package.json and, on a tag, the tag's version. The packed manifest gets Firefox's
# update_url: EXTENSION_UPDATE_URL if set, else updates.json on this project's GitLab Pages.
extension:build:
  stage: build
  image: node:24-alpine
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - apk add --no-cache zip >/dev/null
    - node --test extension/*.test.js
    - VERSION="$(node -p "require('./extension/manifest.json').version")"
    - |
      expected="$(node -p "require('./package.json').version")"
      if [ "$VERSION" != "$expected" ]; then
        echo "extension/manifest.json has version $VERSION, package.json $expected: bump both."
        exit 1
      fi
      if [ -n "${CI_COMMIT_TAG:-}" ] && [ "$VERSION" != "${CI_COMMIT_TAG#v}" ]; then
        echo "extension/manifest.json has version $VERSION, but the tag is $CI_COMMIT_TAG."
        exit 1
      fi
    - mkdir -p dist build && cp -r extension build/extension && rm build/extension/*.test.js
    - UPDATE_URL="${EXTENSION_UPDATE_URL:-${CI_PAGES_URL:+$CI_PAGES_URL/updates.json}}"
    - |
      if [ -n "$UPDATE_URL" ]; then
        node scripts/extension-update-url.mjs build/extension/manifest.json "$UPDATE_URL"
        echo "Firefox update_url: $UPDATE_URL"
      else
        echo "No GitLab Pages and no EXTENSION_UPDATE_URL: the extension gets no update_url."
      fi
    - cd build/extension && zip -r -X "../../dist/$EXTENSION_PACKAGE-$VERSION.zip" . && cd ../..
    - echo "EXTENSION_VERSION=$VERSION" > extension.env
  artifacts:
    name: $EXTENSION_PACKAGE-$CI_COMMIT_REF_SLUG
    paths:
      - dist/
      - build/extension/
    expire_in: 30 days
    reports:
      dotenv: extension.env

# Tags: upload the zip to the package registry.
extension:upload:
  stage: package
  image: alpine:3.22
  needs: [extension:build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - apk add --no-cache curl >/dev/null
    - >
      curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --upload-file "dist/$EXTENSION_PACKAGE-$EXTENSION_VERSION.zip"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$EXTENSION_PACKAGE/$EXTENSION_VERSION/$EXTENSION_PACKAGE-$EXTENSION_VERSION.zip"

# Tags, with AMO keys: have addons.mozilla.org sign the extension as unlisted ("On your own")
# and upload the signed .xpi. A version can be signed only once; a retry after a successful
# signing fails, which is harmless.
extension:sign-firefox:
  stage: package
  image: node:24-alpine
  needs: [extension:build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $AMO_JWT_ISSUER && $AMO_JWT_SECRET
  script:
    - apk add --no-cache curl >/dev/null
    - >
      npx --yes web-ext@8 sign --channel unlisted --source-dir build/extension --artifacts-dir signed
      --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
      --approval-timeout 1800000
    - XPI="$(ls signed/*.xpi | head -n 1)"
    - >
      curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$XPI"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$EXTENSION_PACKAGE/$EXTENSION_VERSION/$EXTENSION_PACKAGE-$EXTENSION_VERSION.xpi"
  artifacts:
    paths:
      - signed/*.xpi
    expire_in: 30 days

# Tags, with AMO keys: publish the signed .xpi and updates.json on GitLab Pages, where Firefox
# looks for updates (the update_url in the signed manifest). Pages must be visible to everyone
# (Settings → General → Visibility → Pages), also for a private project, because Firefox
# checks without signing in. Each deployment replaces the site, so it holds the newest version.
pages:
  stage: release
  image: node:24-alpine
  interruptible: false
  needs: [extension:build, extension:sign-firefox]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $AMO_JWT_ISSUER && $AMO_JWT_SECRET
  script:
    - |
      if [ -z "${CI_PAGES_URL:-}" ]; then
        echo "GitLab Pages is not enabled on this instance; nothing to publish."
        exit 1
      fi
    - mkdir -p public
    - XPI="$EXTENSION_PACKAGE-$EXTENSION_VERSION.xpi"
    - cp "$(ls signed/*.xpi | head -n 1)" "public/$XPI"
    - node scripts/extension-updates.mjs build/extension/manifest.json "public/$XPI" "$CI_PAGES_URL/$XPI" > public/updates.json
    - cat public/updates.json
  artifacts:
    paths:
      - public

# Tags: once the image is pushed, create the release with the CHANGELOG.md notes and the
# extension packages linked.
release:
  stage: release
  image: alpine:3.22
  interruptible: false
  needs:
    - job: build:release
      artifacts: false
    - job: extension:upload
    - job: extension:sign-firefox
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - apk add --no-cache curl jq >/dev/null
    - sh scripts/release.sh
