services:
  nicotes:
    # Later: registry image, e.g. git.nico.software:<port>/1n9i9c7om/nicotes:latest
    image: ${NICOTES_IMAGE:-nicotes:latest}
    build: .
    restart: unless-stopped
    ports:
      - "${NICOTES_HTTP_PORT:-3000}:3000"
    environment:
      NICOTES_ADMIN_USER: ${NICOTES_ADMIN_USER:-}
      NICOTES_ADMIN_PASSWORD: ${NICOTES_ADMIN_PASSWORD:-}
      NICOTES_SECURE_COOKIES: ${NICOTES_SECURE_COOKIES:-false}
      NICOTES_SECRET: ${NICOTES_SECRET:-}
      NICOTES_IMPORT_ALLOW_PRIVATE: ${NICOTES_IMPORT_ALLOW_PRIVATE:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      CRAWL4AI_URL: ${CRAWL4AI_URL:-}
      CRAWL4AI_TOKEN: ${CRAWL4AI_TOKEN:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
      OPENROUTER_IMPORT_MODEL: ${OPENROUTER_IMPORT_MODEL:-}
      OPENROUTER_ORGANIZE_MODEL: ${OPENROUTER_ORGANIZE_MODEL:-}
      OPENROUTER_RESEARCH_MODEL: ${OPENROUTER_RESEARCH_MODEL:-}
      OPENROUTER_ASK_MODEL: ${OPENROUTER_ASK_MODEL:-}
      OPENROUTER_SUMMARY_MODEL: ${OPENROUTER_SUMMARY_MODEL:-}
      OPENROUTER_LINKS_MODEL: ${OPENROUTER_LINKS_MODEL:-}
      NICOTES_AI_COST_LIMIT: ${NICOTES_AI_COST_LIMIT:-}
      NICOTES_SEMANTIC_INDEX: ${NICOTES_SEMANTIC_INDEX:-}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-}
    volumes:
      - nicotes-data:/data

volumes:
  nicotes-data:
