services:
  nicotes:
    # The image CI publishes: main-latest is the newest release, vX.Y.Z pins one (set
    # NICOTES_TAG in .env). In a checkout, `docker compose up -d --build` builds it instead.
    image: registry.nico.software/1n9i9c7om/nicotes:${NICOTES_TAG:-main-latest}
    build: .
    restart: unless-stopped
    ports:
      # Behind a reverse proxy, publish on localhost only ("127.0.0.1:3000:3000") and set
      # NICOTES_SECURE_COOKIES=true in .env when it serves HTTPS.
      - "${NICOTES_HTTP_PORT:-3000}:3000"
    # All settings come from .env next to this file: copy .env.example and fill in its
    # "Required" block. After changing .env, apply it with `docker compose up -d`.
    env_file: .env
    volumes:
      - nicotes-data:/data
      # Backups (NICOTES_BACKUP_DIR=/backups in the image). Set NICOTES_BACKUP_PATH to a host
      # folder, ideally on a NAS or another disk, so backups survive losing the data volume.
      - ${NICOTES_BACKUP_PATH:-nicotes-backups}:/backups

volumes:
  nicotes-data:
  nicotes-backups:
